[package]
name = "libudx"
version = "1.7.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pure Rust implementation of the UDX protocol (tokio-compatible)"
readme = "README.md"
keywords = ["udp", "transport", "networking", "p2p", "congestion-control"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = "0.9"
# Kernel socket buffer sizes (tokio's UdpSocket has no setter); tokio already builds it.
socket2 = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# UDP GSO sends and recvmmsg/GRO receives (src/native/udp.rs).
quinn-udp = { version = "0.5", default-features = false, features = ["tracing"] }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = "0.3"
